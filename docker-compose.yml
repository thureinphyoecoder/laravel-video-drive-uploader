
services:
  worker:
    build:
      context: .
      dockerfile: docker/php/worker.Dockerfile
    container_name: laravel-video-worker
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=3600
    depends_on:
      - db


  app:
    build: ./docker/php
    container_name: laravel-video-app
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    working_dir: /var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
